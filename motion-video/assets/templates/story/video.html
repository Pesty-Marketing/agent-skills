<!doctype html>
<html><head><meta charset="utf-8">
<!-- {{TITLE}}: narrated case study. Every number and claim must match the source page word for word;
     say what happened, never add "because of us" lines the source doesn't make. -->
<link rel="stylesheet" href="motion/motion.css">
<link rel="stylesheet" href="motion/themes/{{THEME}}.css">
<style></style>
</head><body class="preset-story">
<div class="logo"></div>

<section class="scene" data-scene="hook">
  <div class="eyebrow" data-in="0.2">Client name · case study</div>
  <div class="ba">
    <div class="side" data-in="0.5"><div class="k">2023</div><div class="v">$1.0M</div></div>
    <div class="arrow" data-in="1.0" data-anim="fade">&rarr;</div>
    <div class="side after" data-in="1.2"><div class="k">2025</div><div class="v" data-count="2.0" data-from="1.0" data-prefix="$" data-suffix="M" data-in="1.2"></div></div>
  </div>
</section>

<section class="scene" data-scene="goal">
  <div class="eyebrow" data-in="0.1">The goal</div>
  <h1 data-in="0.3">What they <em>wanted</em></h1>
</section>

<section class="scene" data-scene="work">
  <div class="eyebrow" data-in="0.1">What we did</div>
  <ul class="list">
    <li data-in="0.4">First move</li>
    <li data-in="1.2">Second move</li>
  </ul>
</section>

<section class="scene" data-scene="result">
  <div class="bars">
    <div class="bar" style="--v:.5"><i data-in="0.3" data-anim="grow-y"></i><b data-in="0.6" data-anim="fade">$1.0M</b><span>2023</span></div>
    <div class="bar hi" style="--v:1"><i data-in="0.8" data-anim="grow-y"></i><b data-in="1.1" data-anim="fade">$2.0M</b><span>2025</span></div>
  </div>
</section>

<section class="scene" data-scene="end">
  <div class="end-card">
    <div class="end-logo" data-in="0.1" data-anim="fade"></div>
    <h1 data-in="0.4">Next step <em>here</em></h1>
    <div class="url" data-in="0.8">example.com</div>
  </div>
</section>

<div class="captions"></div>
<div class="progress"></div>
<script src="timeline.js"></script>
<script src="motion/motion.js"></script>
</body></html>
